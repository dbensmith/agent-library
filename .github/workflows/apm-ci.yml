# APM CI Pipeline
#
# Automatically validates APM package integrity on every push and pull request.
# Runs structural validation, drift/unicode auditing, and tree-cleanliness checks.
#
# APM CLI installation:
# Research confirmed there is NO official npm package for Microsoft APM. The npm
# package "apm" (v1.0.2) is an unrelated "Actions Per Minute" tool. The correct
# Microsoft APM CLI is a Python package installed via pip ("pip install apm-cli").
# See: https://microsoft.github.io/apm/integrations/ci-cd/
#
# Node.js LTS is included per requirements; APM itself is Python-based.

name: APM CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install APM CLI
        run: pip install apm-cli

      - name: Validate compilation
        run: apm compile --validate

      - name: Audit for drift and hidden issues
        run: apm audit --ci

      - name: Check pack cleanliness
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: apm pack --check-clean
